<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logistiq Portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">Internal Demo</p>
    <h1>Logistiq Portal</h1>
    <p>Suivi simplifié des flux logistiques et ordres de transport.</p>
    <form id="login">
      <input name="username" placeholder="Identifiant" autocomplete="username" />
      <input name="password" placeholder="Mot de passe" type="password" autocomplete="current-password" />
      <button type="submit">Connexion</button>
    </form>
    <pre id="result"></pre>
  </main>
  <script src="/app.js"></script>
</body>
</html>
